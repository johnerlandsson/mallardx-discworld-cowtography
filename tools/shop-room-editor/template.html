<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shop Room Type Editor</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background: #14171a; color: #e6e6e6; margin: 0; }
  header {
    position: sticky; top: 0; background: #1c2024; padding: 12px 16px;
    display: flex; gap: 16px; align-items: center; border-bottom: 1px solid #333; z-index: 10;
  }
  header h1 { font-size: 16px; margin: 0; }
  #search {
    flex: 1; max-width: 400px; padding: 6px 10px; background: #0e1012;
    border: 1px solid #444; color: inherit; border-radius: 4px;
  }
  #changeCount { color: #aaa; font-size: 13px; white-space: nowrap; }
  #downloadBtn {
    padding: 6px 14px; background: #2a6f4a; color: #fff; border: none;
    border-radius: 4px; cursor: pointer; white-space: nowrap;
  }
  main { padding: 16px; }
  details.map-group {
    margin-bottom: 12px; border: 1px solid #2a2e33; border-radius: 6px;
  }
  details.map-group > summary {
    cursor: pointer; padding: 8px 12px; font-weight: 600; background: #1c2024; border-radius: 6px;
  }
  .room-list {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 10px; padding: 10px;
  }
  .room-card { border: 1px solid #2a2e33; border-radius: 6px; padding: 10px; background: #191c1f; }
  .room-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .room-name { font-weight: 600; flex: 1; }
  .room-id { color: #777; font-size: 11px; font-family: monospace; display: block; margin-bottom: 6px; }
  .type-badge {
    display: inline-block; min-width: 18px; text-align: center; padding: 1px 5px;
    border-radius: 3px; font-size: 12px; font-weight: 700; color: #fff;
  }
  .type-badge.none { background: #444; color: #aaa; }
  .item-list { max-height: 200px; overflow-y: auto; font-size: 13px; margin: 0 0 8px; padding-left: 18px; }
  .item-list li { display: flex; justify-content: space-between; gap: 8px; }
  .item-price { color: #9a9; white-space: nowrap; }
  .show-items-btn {
    font-size: 12px; background: none; border: 1px solid #444; color: #ccc;
    border-radius: 4px; padding: 3px 8px; cursor: pointer; margin-bottom: 8px;
  }
  .override-row {
    display: flex; align-items: center; gap: 6px; font-size: 13px;
    border-top: 1px solid #2a2e33; padding-top: 8px;
  }
  .override-row select {
    background: #0e1012; color: inherit; border: 1px solid #444; border-radius: 4px; padding: 2px 4px;
  }
  .override-row select:disabled { opacity: 0.5; }
  .hidden { display: none !important; }
  .type-badge.shop, .type-badge.weapon, .type-badge.armour, .type-badge.clothes,
  .type-badge.food, .type-badge.access, .type-badge.furniture, .type-badge.talker,
  .type-badge.stationery { background: #1c5c3a; }
  .type-badge.bank, .type-badge.changer, .type-badge.mission,
  .type-badge.post, .type-badge.lang { background: #5c3000; }
  .type-badge.crafts { background: #1a4a28; }
  .type-badge.tavern, .type-badge.pub { background: #5c4400; }
  .type-badge.house { background: #3d1e08; }
  .type-badge.club { background: #1a1a4a; }
  .type-badge.pshop { background: #3a0838; }
  .type-badge.tshop { background: #080808; }
  .type-badge.temple { background: #2d1a47; }
</style>
</head>
<body>
<header>
  <h1>Shop Room Type Editor</h1>
  <input id="search" type="search" placeholder="Search room or item name…">
  <span id="changeCount">0 changes pending</span>
  <button id="downloadBtn" type="button">Download room-types.json</button>
</header>
<main id="main"></main>

<script>
/*__MERGE_MODULE__*/

const DATA = "__SHOP_ROOM_DATA__";

const main = document.getElementById('main')
const searchInput = document.getElementById('search')
const changeCountEl = document.getElementById('changeCount')
const downloadBtn = document.getElementById('downloadBtn')

const typeKeys = Object.keys(DATA.typeLetters).sort()
const changes = {}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]))
}

function roomMatchesSearch(room, query) {
  if (!query) return true
  const q = query.toLowerCase()
  if (room.room_short.toLowerCase().includes(q)) return true
  return room.items.some(item => item.name.toLowerCase().includes(q))
}

function buildItemListHtml(room) {
  const items = room.items
  const rows = items.map(item =>
    `<li><span class="item-name">${escapeHtml(item.name)}</span><span class="item-price">${escapeHtml(item.price)}</span></li>`
  ).join('')
  if (items.length > 20) {
    return `
      <button type="button" class="show-items-btn" data-action="toggle-items">Show ${items.length} items</button>
      <ul class="item-list hidden">${rows}</ul>
    `
  }
  return `<ul class="item-list">${rows}</ul>`
}

function buildRoomCardHtml(room) {
  const badgeType = room.effectiveType
  const badgeClass = badgeType || 'none'
  const badgeLetter = badgeType ? (DATA.typeLetters[badgeType] ?? '?') : '–'
  const selectValue = room.hasOverride ? room.overrideType : (room.effectiveType ?? typeKeys[0])
  const optionsHtml = typeKeys.map(t =>
    `<option value="${t}"${t === selectValue ? ' selected' : ''}>${t}</option>`
  ).join('')
  return `
    <div class="room-card" data-room-id="${room.room_id}">
      <div class="room-card-header">
        <span class="type-badge ${badgeClass}">${badgeLetter}</span>
        <span class="room-name">${escapeHtml(room.room_short)}</span>
      </div>
      <span class="room-id">${room.room_id}</span>
      ${buildItemListHtml(room)}
      <div class="override-row">
        <label>
          <input type="checkbox" class="override-checkbox" ${room.hasOverride ? 'checked' : ''}>
          Manual override
        </label>
        <select class="override-select" ${room.hasOverride ? '' : 'disabled'}>${optionsHtml}</select>
      </div>
    </div>
  `
}

function groupByMap(rooms) {
  const groups = []
  let current = null
  for (const room of rooms) {
    if (!current || current.map_name !== room.map_name) {
      current = { map_name: room.map_name, rooms: [] }
      groups.push(current)
    }
    current.rooms.push(room)
  }
  return groups
}

function render() {
  const groups = groupByMap(DATA.rooms)
  main.innerHTML = groups.map(group => `
    <details class="map-group" open>
      <summary>${escapeHtml(group.map_name)} (${group.rooms.length} shops)</summary>
      <div class="room-list">
        ${group.rooms.map(buildRoomCardHtml).join('')}
      </div>
    </details>
  `).join('')
}

function applySearchFilter() {
  const query = searchInput.value.trim()
  document.querySelectorAll('.map-group').forEach(groupEl => {
    let anyVisible = false
    groupEl.querySelectorAll('.room-card').forEach(cardEl => {
      const room = DATA.rooms.find(r => r.room_id === cardEl.dataset.roomId)
      const matches = roomMatchesSearch(room, query)
      cardEl.classList.toggle('hidden', !matches)
      if (matches) anyVisible = true
    })
    groupEl.classList.toggle('hidden', !anyVisible)
    groupEl.open = anyVisible
  })
}

function updateChangeCount() {
  const n = Object.keys(changes).length
  changeCountEl.textContent = `${n} change${n === 1 ? '' : 's'} pending`
}

function recordChange(room, hasOverride, type) {
  const originalHasOverride = room.hasOverride
  const originalType = room.overrideType
  if (hasOverride === originalHasOverride && (!hasOverride || type === originalType)) {
    delete changes[room.room_id]
  } else if (hasOverride) {
    changes[room.room_id] = type
  } else {
    changes[room.room_id] = null
  }
  updateChangeCount()
}

main.addEventListener('change', (e) => {
  const cardEl = e.target.closest('.room-card')
  if (!cardEl) return
  const room = DATA.rooms.find(r => r.room_id === cardEl.dataset.roomId)
  const checkbox = cardEl.querySelector('.override-checkbox')
  const select = cardEl.querySelector('.override-select')
  select.disabled = !checkbox.checked
  recordChange(room, checkbox.checked, select.value)
})

main.addEventListener('click', (e) => {
  if (e.target.dataset.action === 'toggle-items') {
    const list = e.target.nextElementSibling
    list.classList.remove('hidden')
    e.target.classList.add('hidden')
  }
})

searchInput.addEventListener('input', applySearchFilter)

downloadBtn.addEventListener('click', () => {
  const original = JSON.parse(DATA.roomTypesRaw)
  const merged = applyRoomTypeChanges(original, changes)
  const text = serializeRoomTypes(merged)
  const blob = new Blob([text], { type: 'application/json' })
  const url = URL.createObjectURL(blob)
  const a = document.createElement('a')
  a.href = url
  a.download = 'room-types.json'
  a.click()
  URL.revokeObjectURL(url)
})

render()
</script>
</body>
</html>
